<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WaveX Pro</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header>
    <h2 id="username">Dashboard</h2>
    <p id="userid"></p>
  </header>

  <section class="card">
    <h3>Simulated Balance</h3>
    <p class="balance" id="balance">$10,000.00</p>
    <small class="note">Demo balance (not real)</small>
  </section>

  <canvas id="chart"></canvas>

  <section class="actions">
    <button class="btn">🔗 Connect Wallet</button>
    <button class="btn">📈 Start Simulation</button>
    <button class="btn danger">🛠 Admin Panel</button>
  </section>

  <section id="admin" class="admin hidden">
    <h4>Admin Controls</h4>
    <button class="btn small">Reset Balance</button>
    <button class="btn small">Boost Growth</button>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
