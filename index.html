<!DOCTYPE html>
<html>
<head>
  <title>My Telegram Mini App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 30px;
    }
    button {
      padding: 15px 25px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      background: #22c55e;
      color: black;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<h2>🚀 Telegram Mini App</h2>
<p>Welcome, grand godfather</p>

<button onclick="sendData()">Click Me</button>

<script>
  let tg = window.Telegram.WebApp;
  tg.expand();

  function sendData() {
    tg.sendData("Button clicked");
  }
</script>

</body>
</html>
