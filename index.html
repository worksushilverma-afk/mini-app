<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WaveX Dashboard</title>

  <!-- Telegram SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <header class="top">
      <h2 id="username">Welcome</h2>
      <p class="uid" id="userid"></p>
    </header>

    <section class="card">
      <h3>Total Balance</h3>
      <p class="balance">$12,540.00</p>
      <button class="btn primary">Add Funds</button>
    </section>

    <section class="actions">
      <button class="btn">📈 Invest</button>
      <button class="btn">📊 Statistics</button>
      <button class="btn">💼 Portfolio</button>
      <button class="btn danger">Withdraw</button>
    </section>

    <section class="info">
      <h4>Account Status</h4>
      <p class="active">✔ Active & Verified</p>
    </section>

  </div>

  <script src="app.js"></script>
</body>
